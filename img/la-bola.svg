<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 240" width="100%" height="100%">
  <defs>
    <radialGradient id="bolaBg" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="60%" stop-color="#fed7aa"/>
      <stop offset="100%" stop-color="#fbcfe8"/>
    </radialGradient>
    <filter id="loteriaShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="2" dy="2" stdDeviation="0" flood-color="#0f172a" flood-opacity="1"/>
    </filter>
  </defs>

  <!-- Background Card -->
  <rect x="8" y="8" width="184" height="224" rx="8" fill="url(#bolaBg)" stroke="#0f172a" stroke-width="4"/>
  
  <!-- Papel picado garlands in background -->
  <path d="M 12 28 Q 100 48 188 28" fill="none" stroke="#0f172a" stroke-width="2.5" stroke-dasharray="2 4"/>
  <polygon points="30,32 45,34 38,50" fill="#06b6d4" stroke="#0f172a" stroke-width="2"/>
  <polygon points="65,37 80,39 72,55" fill="#ec4899" stroke="#0f172a" stroke-width="2"/>
  <polygon points="100,39 115,38 108,55" fill="#eab308" stroke="#0f172a" stroke-width="2"/>
  <polygon points="135,36 150,33 142,50" fill="#22c55e" stroke="#0f172a" stroke-width="2"/>

  <!-- Confetti bits -->
  <circle cx="28" cy="70" r="3" fill="#ec4899"/>
  <rect x="160" y="65" width="6" height="6" transform="rotate(25 160 65)" fill="#06b6d4"/>
  <circle cx="170" cy="110" r="3.5" fill="#eab308"/>
  <rect x="22" y="115" width="5" height="5" transform="rotate(45 22 115)" fill="#a855f7"/>

  <!-- Character Left: Cheerful Friend in Green with Maraca -->
  <g id="friend-left">
    <!-- Arm raising maraca -->
    <path d="M 50 135 L 35 110" stroke="#0f172a" stroke-width="7" stroke-linecap="round"/>
    <path d="M 50 135 L 35 110" stroke="#fbcfe8" stroke-width="4" stroke-linecap="round"/>
    <!-- Maraca -->
    <path d="M 33 108 L 22 90" stroke="#ca8a04" stroke-width="4" stroke-linecap="round"/>
    <ellipse cx="20" cy="85" rx="10" ry="13" transform="rotate(-30 20 85)" fill="#ef4444" stroke="#0f172a" stroke-width="3"/>
    <path d="M 14 83 Q 22 85 27 88" stroke="#fef08a" stroke-width="3" fill="none"/>
    
    <!-- Body / Poncho -->
    <path d="M 35 155 L 45 130 Q 65 125 75 140 L 65 185 L 25 185 Z" fill="#10b981" stroke="#0f172a" stroke-width="3"/>
    <path d="M 30 170 Q 50 165 65 170" stroke="#fef08a" stroke-width="3" fill="none"/>
    <path d="M 28 178 Q 48 173 63 178" stroke="#f43f5e" stroke-width="3" fill="none"/>

    <!-- Head -->
    <ellipse cx="58" cy="118" rx="12" ry="14" fill="#fbcfe8" stroke="#0f172a" stroke-width="3"/>
    <!-- Hair & Mustache -->
    <path d="M 46 112 Q 58 100 70 110 Q 64 104 46 112 Z" fill="#0f172a"/>
    <ellipse cx="58" cy="123" rx="7" ry="2.5" fill="#0f172a"/>
    <!-- Eyes smiling -->
    <path d="M 50 115 Q 53 112 56 115" stroke="#0f172a" stroke-width="2" fill="none"/>
    <path d="M 60 115 Q 63 112 66 115" stroke="#0f172a" stroke-width="2" fill="none"/>
    
    <!-- Small Sombrero -->
    <path d="M 38 108 Q 58 88 78 108" fill="#eab308" stroke="#0f172a" stroke-width="3"/>
    <ellipse cx="58" cy="108" rx="24" ry="6" fill="#ca8a04" stroke="#0f172a" stroke-width="3"/>
    <path d="M 46 100 Q 58 96 70 100" stroke="#dc2626" stroke-width="3" fill="none"/>
  </g>

  <!-- Character Right: Singing Friend with Jarrito -->
  <g id="friend-right">
    <!-- Body / Blusa bordada -->
    <path d="M 125 140 Q 140 125 155 130 L 175 160 L 170 185 L 125 185 Z" fill="#ec4899" stroke="#0f172a" stroke-width="3"/>
    <path d="M 132 155 Q 148 162 165 155" stroke="#38bdf8" stroke-width="3" fill="none"/>
    <path d="M 134 165 Q 150 172 167 165" stroke="#facc15" stroke-width="3" fill="none"/>

    <!-- Arm raising cup / toast -->
    <path d="M 155 140 L 170 118" stroke="#0f172a" stroke-width="7" stroke-linecap="round"/>
    <path d="M 155 140 L 170 118" stroke="#fbcfe8" stroke-width="4" stroke-linecap="round"/>
    <!-- Jarrito de barro -->
    <path d="M 166 115 L 178 115 L 176 100 L 164 100 Z" fill="#c2410c" stroke="#0f172a" stroke-width="2.5"/>
    <path d="M 178 104 Q 183 108 177 112" stroke="#0f172a" stroke-width="2" fill="none"/>
    <!-- Steam / toast splash -->
    <path d="M 170 95 Q 172 90 170 85" stroke="#f97316" stroke-width="2" fill="none"/>

    <!-- Head -->
    <ellipse cx="142" cy="118" rx="12" ry="14" fill="#fbcfe8" stroke="#0f172a" stroke-width="3"/>
    <!-- Hair with flowers -->
    <path d="M 130 114 Q 142 98 154 112 C 158 126 154 135 154 135 L 130 135 Z" fill="#0f172a"/>
    <circle cx="134" cy="104" r="4" fill="#ef4444" stroke="#0f172a" stroke-width="1.5"/>
    <circle cx="142" cy="101" r="4.5" fill="#facc15" stroke="#0f172a" stroke-width="1.5"/>
    <circle cx="150" cy="104" r="4" fill="#06b6d4" stroke="#0f172a" stroke-width="1.5"/>
    <!-- Singing mouth & eyes -->
    <path d="M 135 114 Q 138 111 141 114" stroke="#0f172a" stroke-width="2" fill="none"/>
    <path d="M 145 114 Q 148 111 151 114" stroke="#0f172a" stroke-width="2" fill="none"/>
    <ellipse cx="143" cy="124" rx="4" ry="5" fill="#991b1b" stroke="#0f172a" stroke-width="1.5"/>
  </g>

  <!-- Center Character: Big Laughing Host in Sombrero -->
  <g id="friend-center">
    <!-- Big Sombrero -->
    <ellipse cx="100" cy="88" rx="55" ry="16" fill="#facc15" stroke="#0f172a" stroke-width="3.5"/>
    <path d="M 72 86 Q 100 48 128 86" fill="#eab308" stroke="#0f172a" stroke-width="3.5"/>
    <path d="M 78 82 Q 100 70 122 82" stroke="#dc2626" stroke-width="3.5" fill="none"/>
    <circle cx="100" cy="58" r="4" fill="#dc2626"/>

    <!-- Head -->
    <ellipse cx="100" cy="115" rx="15" ry="17" fill="#fbcfe8" stroke="#0f172a" stroke-width="3.5"/>
    <!-- Cheerful Big Mustache -->
    <path d="M 85 125 C 92 120 98 122 100 126 C 102 122 108 120 115 125 C 109 132 91 132 85 125 Z" fill="#0f172a"/>
    <!-- Smiling Eyes -->
    <path d="M 90 110 Q 94 105 98 110" stroke="#0f172a" stroke-width="3" stroke-linecap="round" fill="none"/>
    <path d="M 102 110 Q 106 105 110 110" stroke="#0f172a" stroke-width="3" stroke-linecap="round" fill="none"/>
    <!-- Rosy cheeks -->
    <ellipse cx="88" cy="118" rx="3.5" ry="2" fill="#f43f5e" opacity="0.6"/>
    <ellipse cx="112" cy="118" rx="3.5" ry="2" fill="#f43f5e" opacity="0.6"/>

    <!-- Torso / Guayabera & Moño -->
    <path d="M 68 145 L 78 135 Q 100 138 122 135 L 132 145 L 135 195 L 65 195 Z" fill="#ffffff" stroke="#0f172a" stroke-width="3.5"/>
    <!-- Guayabera tucks & Corbatín -->
    <polygon points="94,136 106,136 100,144" fill="#dc2626" stroke="#0f172a" stroke-width="2"/>
    <polygon points="94,148 106,148 100,142" fill="#dc2626" stroke="#0f172a" stroke-width="2"/>
    <circle cx="100" cy="143" r="3" fill="#fef08a" stroke="#0f172a" stroke-width="1.5"/>
    <line x1="88" y1="145" x2="88" y2="190" stroke="#cbd5e1" stroke-width="2"/>
    <line x1="112" y1="145" x2="112" y2="190" stroke="#cbd5e1" stroke-width="2"/>
  </g>

  <!-- Foreground Group Banner / Toast -->
  <g id="foreground-accents">
    <!-- Bottom grass / decorative base -->
    <path d="M 14 200 Q 100 190 186 200 L 186 226 L 14 226 Z" fill="#0f172a"/>
    <text x="100" y="218" text-anchor="middle" font-family="'Courier Prime', monospace, sans-serif" font-weight="900" font-size="13" fill="#fef08a" letter-spacing="2">¡TODOS JUNTOS!</text>
  </g>
</svg>