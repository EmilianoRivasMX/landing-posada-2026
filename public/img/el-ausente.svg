<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 240" width="100%" height="100%">
  <defs>
    <radialGradient id="ausenteBg" cx="50%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="60%" stop-color="#4f46e5"/>
      <stop offset="100%" stop-color="#312e81"/>
    </radialGradient>
  </defs>

  <!-- Background Card -->
  <rect x="8" y="8" width="184" height="224" rx="8" fill="url(#ausenteBg)" stroke="#0f172a" stroke-width="4"/>

  <!-- Night Sky & Moon -->
  <circle cx="150" cy="45" r="22" fill="#fde047" stroke="#0f172a" stroke-width="3"/>
  <circle cx="160" cy="40" r="18" fill="url(#ausenteBg)"/>
  
  <!-- Twinkling Stars (Loteria style diamonds and crosses) -->
  <path d="M 45 35 L 47 43 L 55 45 L 47 47 L 45 55 L 43 47 L 35 45 L 43 43 Z" fill="#fef08a"/>
  <path d="M 100 28 L 101 32 L 105 33 L 101 34 L 100 38 L 99 34 L 95 33 L 99 32 Z" fill="#fef08a"/>
  <path d="M 30 90 L 31 93 L 34 94 L 31 95 L 30 98 L 29 95 L 26 94 L 29 93 Z" fill="#fef08a"/>
  <circle cx="80" cy="65" r="2" fill="#ffffff" opacity="0.8"/>
  <circle cx="130" cy="85" r="1.5" fill="#ffffff" opacity="0.8"/>

  <!-- Ground / Piso de cantina o patio -->
  <path d="M 12 175 Q 100 170 188 175 L 188 228 L 12 228 Z" fill="#b45309" stroke="#0f172a" stroke-width="3"/>
  <line x1="12" y1="195" x2="188" y2="195" stroke="#78350f" stroke-width="2"/>
  <line x1="60" y1="175" x2="50" y2="228" stroke="#78350f" stroke-width="2"/>
  <line x1="140" y1="175" x2="150" y2="228" stroke="#78350f" stroke-width="2"/>

  <!-- Rustic Wooden Chair ("Silla Vacía") -->
  <!-- Back legs -->
  <line x1="68" y1="110" x2="65" y2="190" stroke="#0f172a" stroke-width="8" stroke-linecap="round"/>
  <line x1="68" y1="110" x2="65" y2="190" stroke="#f59e0b" stroke-width="4" stroke-linecap="round"/>
  
  <line x1="132" y1="110" x2="135" y2="190" stroke="#0f172a" stroke-width="8" stroke-linecap="round"/>
  <line x1="132" y1="110" x2="135" y2="190" stroke="#f59e0b" stroke-width="4" stroke-linecap="round"/>

  <!-- Chair Backrest frame -->
  <path d="M 68 75 L 68 140 L 132 140 L 132 75 Z" fill="#d97706" stroke="#0f172a" stroke-width="3.5"/>
  <path d="M 64 70 Q 100 62 136 70" stroke="#0f172a" stroke-width="8" stroke-linecap="round"/>
  <path d="M 64 70 Q 100 62 136 70" stroke="#f59e0b" stroke-width="4" stroke-linecap="round"/>
  <!-- Slats in backrest -->
  <line x1="84" y1="75" x2="84" y2="140" stroke="#0f172a" stroke-width="3"/>
  <line x1="100" y1="75" x2="100" y2="140" stroke="#0f172a" stroke-width="3"/>
  <line x1="116" y1="75" x2="116" y2="140" stroke="#0f172a" stroke-width="3"/>

  <!-- Sarape / Poncho draped over the chair -->
  <path d="M 65 95 Q 85 85 105 95 L 100 155 Q 80 150 65 155 Z" fill="#ec4899" stroke="#0f172a" stroke-width="3"/>
  <!-- Sarape stripes -->
  <path d="M 65 110 L 102 110" stroke="#06b6d4" stroke-width="4"/>
  <path d="M 65 118 L 102 118" stroke="#facc15" stroke-width="3"/>
  <path d="M 65 125 L 101 125" stroke="#10b981" stroke-width="4"/>
  <path d="M 65 133 L 100 133" stroke="#f97316" stroke-width="3"/>
  <!-- Fringe at bottom of sarape -->
  <line x1="68" y1="155" x2="68" y2="162" stroke="#fef08a" stroke-width="2"/>
  <line x1="75" y1="154" x2="75" y2="162" stroke="#fef08a" stroke-width="2"/>
  <line x1="82" y1="153" x2="82" y2="161" stroke="#fef08a" stroke-width="2"/>
  <line x1="89" y1="153" x2="89" y2="161" stroke="#fef08a" stroke-width="2"/>
  <line x1="96" y1="154" x2="96" y2="162" stroke="#fef08a" stroke-width="2"/>

  <!-- Chair Seat (woven palm/tule texture) -->
  <polygon points="55,145 145,145 155,165 45,165" fill="#fef08a" stroke="#0f172a" stroke-width="3.5"/>
  <line x1="60" y1="150" x2="140" y2="150" stroke="#ca8a04" stroke-width="2"/>
  <line x1="52" y1="158" x2="148" y2="158" stroke="#ca8a04" stroke-width="2"/>

  <!-- Front legs & Crossbar -->
  <line x1="52" y1="165" x2="48" y2="210" stroke="#0f172a" stroke-width="8" stroke-linecap="round"/>
  <line x1="52" y1="165" x2="48" y2="210" stroke="#d97706" stroke-width="4" stroke-linecap="round"/>
  
  <line x1="148" y1="165" x2="152" y2="210" stroke="#0f172a" stroke-width="8" stroke-linecap="round"/>
  <line x1="148" y1="165" x2="152" y2="210" stroke="#d97706" stroke-width="4" stroke-linecap="round"/>

  <line x1="50" y1="190" x2="150" y2="190" stroke="#0f172a" stroke-width="5" stroke-linecap="round"/>
  <line x1="50" y1="190" x2="150" y2="190" stroke="#b45309" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Solitary Sombrero resting on the empty chair -->
  <g id="sombrero-vacio" transform="translate(15, 30) rotate(-12 100 115)">
    <ellipse cx="90" cy="115" rx="36" ry="11" fill="#fde047" stroke="#0f172a" stroke-width="3"/>
    <path d="M 74 113 Q 90 85 106 113" fill="#eab308" stroke="#0f172a" stroke-width="3"/>
    <path d="M 78 110 Q 90 102 102 110" stroke="#dc2626" stroke-width="2.5" fill="none"/>
  </g>

  <!-- Sad little tumbleweed / fallen flower on floor -->
  <circle cx="160" cy="202" r="6" fill="#ef4444" stroke="#0f172a" stroke-width="2"/>
  <circle cx="157" cy="198" r="4" fill="#f43f5e"/>
  <circle cx="164" cy="204" r="4" fill="#fb7185"/>

  <!-- Footer Banner -->
  <path d="M 14 212 L 186 212 L 186 226 L 14 226 Z" fill="#0f172a"/>
  <text x="100" y="223" text-anchor="middle" font-family="'Courier Prime', monospace, sans-serif" font-weight="900" font-size="10" fill="#fde047" letter-spacing="1">TE GUARDAREMOS UN TAMAL</text>
</svg>